name: Update agents

on:
  workflow_dispatch:
  schedule:
    - cron: "54 6 * * 1" # Mondays at 6:54AM

permissions:
  contents: write

concurrency:
  group: update-agents
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          package-manager-cache: false

      - name: Check npm and update agent lockfiles
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          update=false
          for agent in codex claude; do
            case "$agent" in
              codex) package='@openai/codex' ;;
              claude) package='@anthropic-ai/claude-code' ;;
            esac
            current=$(node --eval \
              "process.stdout.write(require('./$agent/package.json').dependencies['$package'])")
            latest=$(npm view --silent "$package" version)

            if [ -z "$latest" ]; then
              echo "npm returned an empty $agent version" >&2
              exit 1
            fi

            if [ "$current" = "$latest" ]; then
              echo "$agent is already current at $current." >> "$GITHUB_STEP_SUMMARY"
            else
              update=true
              echo "Updating $agent from $current to $latest." >> "$GITHUB_STEP_SUMMARY"
              npm install \
                --prefix "$agent" \
                --package-lock-only \
                --save-exact \
                --ignore-scripts \
                --no-audit \
                --no-fund \
                "$package@$latest"
            fi
          done
          echo "update=$update" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        if: steps.versions.outputs.update == 'true'
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and smoke-test agents on Linux
        if: steps.versions.outputs.update == 'true'
        env:
          NIXPKGS_ALLOW_UNFREE: "1" # Explicitly allow Claude Code in CI.
        shell: bash
        run: |
          set -euo pipefail

          nix flake check --impure --all-systems --no-build
          for agent in codex claude; do
            agent_out=$(nix build ".#$agent" --impure --no-link --print-out-paths --print-build-logs)
            "$agent_out/bin/$agent" --version
          done

      - name: Commit and push update
        if: steps.versions.outputs.update == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            codex/package.json \
            codex/package-lock.json \
            claude/package.json \
            claude/package-lock.json
          git diff --cached --check
          git commit -m "chore: update coding agents"
          git push origin HEAD:main
